name: Refresh portal screenshot
on:
  workflow_dispatch:
  push:
    paths:
      - portal-screenshot.jpg.b64.s19
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEG and commit
        run: |
          set -euo pipefail
          cat portal-screenshot.jpg.b64.s00 portal-screenshot.jpg.b64.s01 portal-screenshot.jpg.b64.s02 portal-screenshot.jpg.b64.s03 portal-screenshot.jpg.b64.s04 portal-screenshot.jpg.b64.s05 portal-screenshot.jpg.b64.s06 portal-screenshot.jpg.b64.s07 portal-screenshot.jpg.b64.s08 portal-screenshot.jpg.b64.s09 portal-screenshot.jpg.b64.s10 portal-screenshot.jpg.b64.s11 portal-screenshot.jpg.b64.s12 portal-screenshot.jpg.b64.s13 portal-screenshot.jpg.b64.s14 portal-screenshot.jpg.b64.s15 portal-screenshot.jpg.b64.s16 portal-screenshot.jpg.b64.s17 portal-screenshot.jpg.b64.s18 portal-screenshot.jpg.b64.s19 portal-screenshot.jpg.b64.s20 > /tmp/all.b64
          base64 -d /tmp/all.b64 > portal-screenshot.jpg
          ls -la portal-screenshot.jpg
          python3 -c 'd=open("portal-screenshot.jpg","rb").read(3); assert d==bytes([255,216,255]), d'
          git config user.name hern1824
          git config user.email hernkim@gmail.com
          git add portal-screenshot.jpg
          git rm -f portal-screenshot.jpg.b64.s00 portal-screenshot.jpg.b64.s01 portal-screenshot.jpg.b64.s02 portal-screenshot.jpg.b64.s03 portal-screenshot.jpg.b64.s04 portal-screenshot.jpg.b64.s05 portal-screenshot.jpg.b64.s06 portal-screenshot.jpg.b64.s07 portal-screenshot.jpg.b64.s08 portal-screenshot.jpg.b64.s09 portal-screenshot.jpg.b64.s10 portal-screenshot.jpg.b64.s11 portal-screenshot.jpg.b64.s12 portal-screenshot.jpg.b64.s13 portal-screenshot.jpg.b64.s14 portal-screenshot.jpg.b64.s15 portal-screenshot.jpg.b64.s16 portal-screenshot.jpg.b64.s17 portal-screenshot.jpg.b64.s18 portal-screenshot.jpg.b64.s19 portal-screenshot.jpg.b64.s20 || true
          git rm -f portal-screenshot.jpg.b64.part04 _agent_write_probe.txt _agent_tiny_test.jpg _agent_chunk_probe.txt || true
          rm -f .github/workflows/refresh-portal-screenshot.yml
          git add -A
          git commit -m "Refresh START Portal marketing screenshot"
          git push
